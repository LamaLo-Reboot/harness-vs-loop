[project]
name = "quote-agent-server"
version = "0.1.0"
description = "The quote agent of the Harness vs Loop demo, plus a fake engine for people who clone the repo."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# An application, not a library: uv installs the dependencies but not the project itself.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
